<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casse-Briques Ultime - Édition Boss Volant</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 5px;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }
        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 100%;
            max-width: 500px;
        }
        #info {
            display: flex;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            flex-wrap: wrap;
            justify-content: center;
        }
        .badge {
            background: rgba(30, 41, 59, 0.85);
            padding: 4px 10px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .badge-gold {
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.3);
        }
        .badge-record-broken {
            background: #f59e0b;
            color: #0f172a;
            animation: pulseRecord 1s infinite;
        }
        @keyframes pulseRecord {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        canvas {
            border: 2px solid #334155;
            background: radial-gradient(circle at center, #090d16 0%, #020617 100%);
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 3;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            cursor: crosshair;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .btn {
            padding: 8px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(79, 70, 229, 0.4);
            flex: 1;
            min-width: 30%;
        }
        .btn-secondary { background: linear-gradient(135deg, #475569 0%, #334155 100%); }
        .btn-danger { background: linear-gradient(135deg, #e11d48 0%, #9f1239 100%); }
        .btn-warning { background: linear-gradient(135deg, #d97706 0%, #b45309 100%); }
        .btn-success { background: linear-gradient(135deg, #059669 0%, #047857 100%); }
        .btn-rec { background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); animation: pulseRec 1.5s infinite; }

        @keyframes pulseRec {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        #modal {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 1rem;
        }
        .modal-content {
            background: #1e293b;
            border: 2px solid #334155;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 20px 25px rgba(0,0,0,0.5);
        }
        .modal-content h2 {
            color: #38bdf8;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            margin-bottom: 1rem;
            text-align: center;
            box-sizing: border-box;
        }
        .high-scores-list {
            list-style: none;
            padding: 0;
            margin: 1rem 0;
            text-align: left;
            max-height: 140px;
            overflow-y: auto;
        }
        .high-scores-list li {
            display: flex;
            justify-content: space-between;
            padding: 6px 8px;
            border-bottom: 1px solid #334155;
            font-size: 0.85rem;
        }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T40JJ2QGKE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-E1VXXHPSZD');
    </script>
</head>
<body>

    <div id="game-wrapper">
        <div id="info">
            <div class="badge">SCORE: <span id="score">0</span></div>
            <div class="badge">NIVEAU: <span id="level">1</span></div>
            <div class="badge">VIES: <span id="lives">3</span></div>
            <div id="highScoreBadge" class="badge badge-gold">REC: <span id="highScore">0</span></div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div class="btn-group">
            <button id="startBtn" class="btn">Jouer</button>
            <button id="pauseBtn" class="btn btn-warning">Pause</button>
            <button id="recBtn" class="btn btn-secondary">🔴 REC (30s)</button>
            <button id="resetBtn" class="btn btn-danger">Reset</button>
            <button id="scoresBtn" class="btn btn-secondary">Scores</button>
            <button id="soundBtn" class="btn btn-secondary">🔊 Son</button>
        </div>
    </div>

    <!-- Modale unique -->
    <div id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">CASSE-BRIQUES ULTIME</h2>
            <p id="modalText" style="margin-bottom: 1rem; color: #94a3b8;">Choisissez votre mode :</p>
            
            <div id="configSection">
                <select id="difficultySelect">
                    <option value="easy">Facile (5 Vies)</option>
                    <option value="normal" selected>Normal (Standard Arcade)</option>
                    <option value="hard">Expert (Rapide)</option>
                    <option value="hardcore">Hardcore (1 Vie, Ultra rapide)</option>
                </select>
                <button id="launchGameBtn" class="btn" style="width: 100%;">Commencer</button>
            </div>

            <!-- Boutique entre les niveaux -->
            <div id="shopSection" style="display:none;">
                <p id="shopInfo" style="color: #38bdf8; margin-bottom: 10px; font-size: 0.9rem;"></p>
                <button id="buyLifeBtn" class="btn btn-success" style="width: 100%; margin-bottom: 6px;">❤️ Acheter 1 Vie (30 000 pts)</button>
                <button id="buyPaddleBtn" class="btn btn-warning" style="width: 100%; margin-bottom: 10px;">🛡️ Élargir Raquette (10 000 pts)</button>
                <button id="nextLevelBtn" class="btn" style="width: 100%;">Niveau Suivant ➔</button>
            </div>

            <div id="nameInputSection" style="display:none;">
                <input type="text" id="playerName" placeholder="Votre pseudo" maxlength="15">
                <button id="saveScoreBtn" class="btn" style="width: 100%;">Enregistrer</button>
            </div>

            <div id="leaderboardSection" style="display:none;">
                <ul class="high-scores-list" id="scoresList"></ul>
                <div id="achievementsBox" style="font-size:0.75rem; color:#38bdf8; margin: 6px 0; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 4px;"></div>
                <div style="display: flex; gap: 6px; margin-top: 10px;">
                    <button id="shareScoreBtn" class="btn btn-success" style="display:none;">📤 Partager</button>
                    <button id="closeModalBtn" class="btn" style="flex:1;">Fermer</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('score');
        const levelSpan = document.getElementById('level');
        const livesSpan = document.getElementById('lives');
        const highScoreSpan = document.getElementById('highScore');
        const highScoreBadge = document.getElementById('highScoreBadge');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const recBtn = document.getElementById('recBtn');
        const resetBtn = document.getElementById('resetBtn');
        const scoresBtn = document.getElementById('scoresBtn');
        const soundBtn = document.getElementById('soundBtn');
        
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        const configSection = document.getElementById('configSection');
        const difficultySelect = document.getElementById('difficultySelect');
        const launchGameBtn = document.getElementById('launchGameBtn');
        const shopSection = document.getElementById('shopSection');
        const shopInfo = document.getElementById('shopInfo');
        const buyLifeBtn = document.getElementById('buyLifeBtn');
        const buyPaddleBtn = document.getElementById('buyPaddleBtn');
        const nextLevelBtn = document.getElementById('nextLevelBtn');
        const nameInputSection = document.getElementById('nameInputSection');
        const leaderboardSection = document.getElementById('leaderboardSection');
        const playerNameInput = document.getElementById('playerName');
        const saveScoreBtn = document.getElementById('saveScoreBtn');
        const scoresList = document.getElementById('scoresList');
        const achievementsBox = document.getElementById('achievementsBox');
        const shareScoreBtn = document.getElementById('shareScoreBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');

        let score = 0;
        let level = 1;
        let lives = 3;
        let difficulty = 'normal';
        let gameActive = false;
        let isPaused = false;
        let soundEnabled = true;
        let screenShake = 0;
        let flashEffect = 0;
        let portalTimer = 0;
        let combo = 0;
        let comboTimer = 0;

        let floatingTexts = [];

        // Gestion du Boss Volant (tous les 5 niveaux, plus coriace à chaque fois)
        let isBossLevel = false;
        let boss = { 
            x: 300, 
            y: 70, 
            width: 220, 
            height: 50, 
            dx: 2, 
            dy: 1, 
            health: 30, 
            maxHealth: 30,
            animTimer: 0 
        };

        // Gestion de l'enregistrement vidéo 30s avec l'audio du jeu inclus
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        recBtn.addEventListener('click', () => {
            if (!isRecording) {
                startRecording(30);
            } else {
                stopRecording();
            }
        });

        function startRecording(durationSeconds = 30) {
            try {
                const canvasStream = canvas.captureStream(30);
                let combinedStream = canvasStream;

                if (audioCtx && audioCtx.destination) {
                    const destination = audioCtx.createMediaStreamDestination();
                    const audioStream = destination.stream;
                    if (audioStream.getAudioTracks().length > 0) {
                        combinedStream = new MediaStream([
                            ...canvasStream.getVideoTracks(),
                            ...audioStream.getAudioTracks()
                        ]);
                    }
                }

                recordedChunks = [];
                let options = { mimeType: 'video/webm;codecs=vp9,opus' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'video/webm' };
                }

                mediaRecorder = new MediaRecorder(combinedStream, options);

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `casse-briques-replay-30s-${Date.now()}.webm`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                    }, 100);
                    recBtn.textContent = "🔴 REC (30s)";
                    recBtn.className = "btn btn-secondary";
                    isRecording = false;
                    alert("Enregistrement de 30 secondes terminé avec audio ! La vidéo a été téléchargée.");
                };

                mediaRecorder.start();
                isRecording = true;
                recBtn.textContent = `⏹️ Stop (${durationSeconds}s)`;
                recBtn.className = "btn btn-rec";

                setTimeout(() => {
                    if (isRecording && mediaRecorder && mediaRecorder.state === 'recording') {
                        stopRecording();
                    }
                }, durationSeconds * 1000);

            } catch (e) {
                alert("L'enregistrement vidéo avec audio n'est pas supporté par ce navigateur.");
                isRecording = false;
                recBtn.textContent = "🔴 REC (30s)";
                recBtn.className = "btn btn-secondary";
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
            }
        }

        let achievements = JSON.parse(localStorage.getItem('brickGameAchievements')) || {
            fireMaster: false,
            laserSniper: false,
            survivor: false
        };

        function triggerVibration(duration) {
            if (navigator.vibrate) navigator.vibrate(duration);
        }

        let audioCtx = null;
        function playSound(type) {
            if (!soundEnabled) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'brick') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'powerup') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'levelup') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.4);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            }
        }

        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundBtn.textContent = soundEnabled ? "🔊 Son" : "🔇 Son";
        });

        let highScores = JSON.parse(localStorage.getItem('brickGameScores')) || [];
        updateHighScoreDisplay();

        function updateHighScoreDisplay() {
            highScoreSpan.textContent = highScores.length > 0 ? highScores[0].score : '0';
        }

        const paddle = {
            width: 120,
            height: 16,
            x: 340,
            y: 560,
            angle: 0,
            targetAngle: 0,
            laserTimer: 0
        };

        let balls = [];
        let bricks = [];
        const brickRowCount = 5;
        const brickColumnCount = 8;
        const brickWidth = 75;
        const brickHeight = 22;
        const brickPadding = 12;
        let brickOffsetLeft = 0;
        let brickOffsetTop = 60;

        let particles = [];
        let powerups = [];
        let lasers = [];

        function initLevel() {
            // Détection du niveau Boss (tous les 5 niveaux : 5, 10, 15...)
            isBossLevel = (level % 5 === 0);

            if (isBossLevel) {
                bricks = [];
                let bossHealth = 30 + (level * 10); // Plus le niveau est élevé, plus le boss a de PV !
                boss = { 
                    x: canvas.width / 2 - 110, 
                    y: 70, 
                    width: 220, 
                    height: 50, 
                    dx: (2 + (level * 0.15)) * (Math.random() < 0.5 ? 1 : -1), 
                    dy: 0.8, 
                    health: bossHealth, 
                    maxHealth: bossHealth,
                    animTimer: 0
                };
            } else {
                const totalGridWidth = (brickColumnCount * brickWidth) + ((brickColumnCount - 1) * brickPadding);
                brickOffsetLeft = (canvas.width - totalGridWidth) / 2;
                brickOffsetTop = Math.min(60 + (level - 1) * 18, 170);

                bricks = [];
                for (let c = 0; c < brickColumnCount; c++) {
                    bricks[c] = [];
                    for (let r = 0; r < brickRowCount; r++) {
                        let hitsNeeded = 1;
                        let isTNT = false;

                        // Difficulté progressive des briques selon le niveau
                        if (level >= 3 && r === 0 && (c === 3 || c === 4)) {
                            hitsNeeded = Math.min(50 + (level * 5), 100);
                        } else if (Math.random() < (0.10 + (level * 0.01)) && r > 0) {
                            isTNT = true;
                        } else if (level >= 2 && r === 0) {
                            hitsNeeded = Math.min(5 + level, 15);
                        }

                        bricks[c][r] = { x: 0, y: 0, status: 1, hits: hitsNeeded, maxHits: hitsNeeded, tnt: isTNT };
                    }
                }
            }
            powerups = [];
            lasers = [];
            portalTimer = 0;
            resetBalls();
        }

        function resetBalls() {
            balls = [{
                x: paddle.x + paddle.width / 2,
                y: paddle.y - 15,
                radius: 8,
                dx: 0,
                dy: 0,
                launched: false,
                fireball: false,
                trail: []
            }];
        }

        initLevel();

        function handleMove(clientX) {
            if (isPaused) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            let touchX = (clientX - rect.left) * scaleX;
            paddle.x = touchX - paddle.width / 2;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;

            balls.forEach(b => {
                if (!b.launched) {
                    b.x = paddle.x + paddle.width / 2;
                }
            });
        }

        canvas.addEventListener('mousemove', (e) => handleMove(e.clientX));
        canvas.addEventListener('touchmove', (e) => { if (e.touches.length > 0) handleMove(e.touches[0].clientX); }, { passive: true });
        canvas.addEventListener('touchstart', (e) => { if (e.touches.length > 0) handleMove(e.touches[0].clientX); }, { passive: true });

        canvas.addEventListener('wheel', (e) => {
            if (isPaused) return;
            e.preventDefault();
            paddle.targetAngle += Math.sign(e.deltaY) * 0.15;
            paddle.targetAngle = Math.max(-0.6, Math.min(0.6, paddle.targetAngle));
        }, { passive: false });

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x, y: y,
                    dx: (Math.random() - 0.5) * 6,
                    dy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1,
                    decay: 0.03
                });
            }
        }

        function addFloatingText(text, x, y, color = '#38bdf8') {
            floatingTexts.push({ text, x, y, alpha: 1, color });
        }

        function explodeTNT(col, row) {
            playSound('explosion');
            screenShake = 15;
            flashEffect = 8;
            triggerVibration(150);

            for (let c = col - 1; c <= col + 1; c++) {
                for (let r = row - 1; r <= row + 1; r++) {
                    if (c >= 0 && c < brickColumnCount && r >= 0 && r < brickRowCount) {
                        let target = bricks[c][r];
                        if (target.status === 1) {
                            target.status = 0;
                            let bx = brickOffsetLeft + c * (brickWidth + brickPadding);
                            let by = brickOffsetTop + r * (brickHeight + brickPadding);
                            createParticles(bx + brickWidth/2, by + brickHeight/2, '#f97316');
                            score += 200 * level;
                        }
                    }
                }
            }
            scoreSpan.textContent = score;
            addFloatingText("BOOM! 💥", canvas.width / 2, canvas.height / 3, '#f97316');
        }

        function spawnPowerup(x, y) {
            const pool = [
                { type: 'multi', trap: false },
                { type: 'expand', trap: false },
                { type: 'fire', trap: false },
                { type: 'laser', trap: false },
                { type: 'life', trap: false },
                { type: 'portal', trap: false },
                { type: 'shrink', trap: true },
                { type: 'speedup', trap: true }
            ];
            const choice = pool[Math.floor(Math.random() * pool.length)];
            powerups.push({ x, y, width: 24, height: 24, dy: 2, type: choice.type, trap: choice.trap });
        }

        function update() {
            if (!gameActive || isPaused) return;

            if (screenShake > 0) screenShake--;
            if (flashEffect > 0) flashEffect--;
            if (portalTimer > 0) portalTimer--;

            if (comboTimer > 0) {
                comboTimer--;
                if (comboTimer === 0) combo = 0;
            }

            let currentHighScore = highScores.length > 0 ? highScores[0].score : 0;
            if (currentHighScore > 0 && score > currentHighScore) {
                highScoreBadge.className = "badge badge-record-broken";
            } else {
                highScoreBadge.className = "badge badge-gold";
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 1;
                ft.alpha -= 0.02;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }

            paddle.angle += (paddle.targetAngle - paddle.angle) * 0.2;
            paddle.targetAngle *= 0.92;

            // Déplacement du Boss Volant (Horizontal + Mouvement vertical de va-et-vient type Mario)
            if (isBossLevel) {
                boss.x += boss.dx;
                boss.y += boss.dy;
                boss.animTimer += 0.1;

                // Rebond sur les côtés
                if (boss.x < 20 || boss.x + boss.width > canvas.width - 20) {
                    boss.dx *= -1;
                }
                // Va-et-vient vertical entre la zone haute (50px) et le milieu (150px)
                if (boss.y < 50 || boss.y > 150) {
                    boss.dy *= -1;
                }
            }

            if (paddle.laserTimer > 0) {
                paddle.laserTimer--;
                if (paddle.laserTimer % 20 === 0) {
                    lasers.push({ x: paddle.x + 15, y: paddle.y, dy: -8 });
                    lasers.push({ x: paddle.x + paddle.width - 15, y: paddle.y, dy: -8 });
                    playSound('hit');
                }
            }

            for (let i = lasers.length - 1; i >= 0; i--) {
                let l = lasers[i];
                l.y += l.dy;
                if (l.y < 0) {
                    lasers.splice(i, 1);
                    continue;
                }

                if (isBossLevel) {
                    if (l.x > boss.x && l.x < boss.x + boss.width && l.y > boss.y && l.y < boss.y + boss.height) {
                        boss.health--;
                        lasers.splice(i, 1);
                        playSound('hit');
                        if (boss.health <= 0) {
                            score += 5000 * level;
                            scoreSpan.textContent = score;
                            gameActive = false;
                            playSound('levelup');
                            triggerShopModal();
                        }
                        continue;
                    }
                } else {
                    for (let c = 0; c < brickColumnCount; c++) {
                        for (let r = 0; r < brickRowCount; r++) {
                            let brick = bricks[c][r];
                            if (brick.status === 1) {
                                let bx = brickOffsetLeft + c * (brickWidth + brickPadding);
                                let by = brickOffsetTop + r * (brickHeight + brickPadding);
                                if (l.x > bx && l.x < bx + brickWidth && l.y > by && l.y < by + brickHeight) {
                                    if (brick.tnt) {
                                        explodeTNT(c, r);
                                    } else {
                                        brick.hits--;
                                        if (brick.hits <= 0) {
                                            brick.status = 0;
                                            combo++;
                                            comboTimer = 180;
                                            let points = 100 * level * Math.max(1, combo);
                                            score += points;
                                            scoreSpan.textContent = score;
                                            addFloatingText(`+${points} (x${combo})`, bx, by, '#fbbf24');
                                            createParticles(bx + brickWidth/2, by + brickHeight/2, '#38bdf8');
                                            playSound('brick');
                                        } else {
                                            playSound('hit');
                                        }
                                    }
                                    lasers.splice(i, 1);
                                    break;
                                }
                            }
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                let pu = powerups[i];
                pu.y += pu.dy;
                if (pu.x > paddle.x && pu.x < paddle.x + paddle.width &&
                    pu.y > paddle.y && pu.y < paddle.y + paddle.height) {
                    
                    if (pu.trap) {
                        playSound('trap');
                        triggerVibration(200);
                        if (pu.type === 'shrink') paddle.width = Math.max(paddle.width - 30, 60);
                        else if (pu.type === 'speedup') balls.forEach(b => { b.dx *= 1.3; b.dy *= 1.3; });
                    } else {
                        playSound('powerup');
                        triggerVibration(50);
                        if (pu.type === 'multi') {
                            let extraBalls = [];
                            balls.forEach(b => {
                                extraBalls.push({ ...b, dx: b.dx + 2, dy: b.dy, launched: true, trail: [] });
                                extraBalls.push({ ...b, dx: b.dx - 2, dy: b.dy, launched: true, trail: [] });
                            });
                            balls.push(...extraBalls);
                        } else if (pu.type === 'expand') {
                            paddle.width = Math.min(paddle.width + 30, 180);
                        } else if (pu.type === 'fire') {
                            balls.forEach(b => b.fireball = true);
                            achievements.fireMaster = true;
                            localStorage.setItem('brickGameAchievements', JSON.stringify(achievements));
                        } else if (pu.type === 'laser') {
                            paddle.laserTimer = 300;
                        } else if (pu.type === 'life') {
                            lives++;
                            livesSpan.textContent = lives;
                        } else if (pu.type === 'portal') {
                            portalTimer = 400;
                        }
                    }
                    powerups.splice(i, 1);
                } else if (pu.y > canvas.height) {
                    powerups.splice(i, 1);
                }
            }

            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];
                if (!b.launched) continue;

                const steps = 5;
                const subDx = b.dx / steps;
                const subDy = b.dy / steps;
                let ballLost = false;

                for (let s = 0; s < steps; s++) {
                    b.x += subDx;
                    b.y += subDy;

                    if (s === 0) {
                        b.trail.push({ x: b.x, y: b.y });
                        if (b.trail.length > 8) b.trail.shift();
                    }

                    if (portalTimer > 0) {
                        if (b.x < 0) b.x = canvas.width - 5;
                        else if (b.x > canvas.width) b.x = 5;
                    } else {
                        if (b.x - b.radius < 0) { b.x = b.radius; b.dx *= -1; break; }
                        if (b.x + b.radius > canvas.width) { b.x = canvas.width - b.radius; b.dx *= -1; break; }
                    }

                    if (b.y - b.radius < 0) { b.y = b.radius; b.dy *= -1; break; }

                    if (b.y + b.radius >= paddle.y && b.y - b.radius <= paddle.y + paddle.height &&
                        b.x >= paddle.x && b.x <= paddle.x + paddle.width) {
                        
                        playSound('hit');
                        triggerVibration(40);
                        b.y = paddle.y - b.radius;
                        let hitPoint = (b.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                        let bounceAngle = hitPoint * (Math.PI / 3) + paddle.angle;
                        let currentSpeed = Math.hypot(b.dx, b.dy);

                        b.dx = currentSpeed * Math.sin(bounceAngle);
                        b.dy = -Math.abs(currentSpeed * Math.cos(bounceAngle));
                        break;
                    }

                    // Collision avec le Boss Volant
                    if (isBossLevel) {
                        if (b.x > boss.x && b.x < boss.x + boss.width && b.y > boss.y && b.y < boss.y + boss.height) {
                            if (!b.fireball) b.dy *= -1;
                            boss.health--;
                            playSound('hit');
                            createParticles(b.x, b.y, '#ef4444');
                            if (boss.health <= 0) {
                                score += 5000 * level;
                                scoreSpan.textContent = score;
                                gameActive = false;
                                playSound('levelup');
                                triggerShopModal();
                                break;
                            }
                        }
                    } else {
                        let collisionDetected = false;
                        for (let c = 0; c < brickColumnCount; c++) {
                            for (let r = 0; r < brickRowCount; r++) {
                                let brick = bricks[c][r];
                                if (brick.status === 1) {
                                    let bx = brickOffsetLeft + c * (brickWidth + brickPadding);
                                    let by = brickOffsetTop + r * (brickHeight + brickPadding);

                                    if (b.x > bx && b.x < bx + brickWidth && b.y > by && b.y < by + brickHeight) {
                                        if (brick.tnt) {
                                            explodeTNT(c, r);
                                        } else {
                                            if (!b.fireball) b.dy *= -1;
                                            brick.hits--;

                                            if (brick.hits >= 50) {
                                                screenShake = 10;
                                                flashEffect = 5;
                                                triggerVibration(100);
                                            }

                                            if (brick.hits <= 0) {
                                                brick.status = 0;
                                                combo++;
                                                comboTimer = 180;
                                                let points = 100 * level * Math.max(1, combo) * (brick.maxHits > 1 ? brick.maxHits : 1);
                                                score += points;
                                                scoreSpan.textContent = score;
                                                addFloatingText(`+${points} (x${combo})`, bx, by, '#fbbf24');
                                                createParticles(bx + brickWidth/2, by + brickHeight/2, b.fireball ? '#ef4444' : '#38bdf8');
                                                playSound('brick');
                                                if (Math.random() < 0.25) spawnPowerup(bx + brickWidth/2, by + brickHeight/2);
                                            } else {
                                                playSound('hit');
                                                createParticles(bx + brickWidth/2, by + brickHeight/2, '#f43f5e');
                                            }
                                        }
                                        collisionDetected = true;
                                        break;
                                    }
                                }
                            }
                            if (collisionDetected) break;
                        }
                        if (collisionDetected) break;
                    }

                    if (b.y - b.radius > canvas.height) {
                        ballLost = true;
                        break;
                    }
                }

                if (!isBossLevel) {
                    let levelComplete = true;
                    for (let c = 0; c < brickColumnCount; c++) {
                        for (let r = 0; r < brickRowCount; r++) {
                            if (bricks[c][r].status === 1) levelComplete = false;
                        }
                    }

                    if (levelComplete) {
                        gameActive = false;
                        playSound('levelup');
                        if (lives === 1) achievements.survivor = true;
                        localStorage.setItem('brickGameAchievements', JSON.stringify(achievements));
                        triggerShopModal();
                        break;
                    }
                }

                if (ballLost) {
                    balls.splice(i, 1);
                    combo = 0;
                }
            }

            if (balls.length === 0) {
                lives--;
                livesSpan.textContent = lives;
                playSound('lose');
                triggerVibration(300);
                combo = 0;
                if (lives <= 0) {
                    triggerGameOverModal();
                } else {
                    resetBalls();
                }
            }
        }

        function triggerShopModal() {
            modalTitle.textContent = `NIVEAU ${level} TERMINÉ !`;
            modalText.style.display = 'none';
            configSection.style.display = 'none';
            nameInputSection.style.display = 'none';
            leaderboardSection.style.display = 'none';
            shopSection.style.display = 'block';
            shopInfo.textContent = `Score actuel : ${score} pts | Vies : ${lives}`;
            modal.style.display = 'flex';
        }

        buyLifeBtn.addEventListener('click', () => {
            if (score >= 30000) {
                score -= 30000;
                lives++;
                scoreSpan.textContent = score;
                livesSpan.textContent = lives;
                shopInfo.textContent = `Achat réussi ! Score : ${score} pts | Vies : ${lives}`;
            } else {
                alert("Il faut 30 000 points pour acheter une vie !");
            }
        });

        buyPaddleBtn.addEventListener('click', () => {
            if (score >= 10000) {
                score -= 10000;
                paddle.width = Math.min(paddle.width + 30, 200);
                scoreSpan.textContent = score;
                shopInfo.textContent = `Raquette élargie ! Score : ${score} pts`;
            } else {
                alert("Il faut 10 000 points pour élargir la raquette !");
            }
        });

        nextLevelBtn.addEventListener('click', () => {
            level++;
            levelSpan.textContent = level;
            initLevel();
            modal.style.display = 'none';
            gameActive = true;
        });

        function triggerGameOverModal() {
            gameActive = false;
            modalTitle.textContent = "PARTIE TERMINÉE";
            modalText.style.display = 'block';
            modalText.textContent = `Score final : ${score} (Niveau ${level})`;
            configSection.style.display = 'none';
            shopSection.style.display = 'none';
            nameInputSection.style.display = 'block';
            leaderboardSection.style.display = 'none';
            shareScoreBtn.style.display = 'none';
            playerNameInput.value = '';
            modal.style.display = 'flex';
        }

        function showLeaderboardModal() {
            modalTitle.textContent = "🏆 SCORES & SUCCÈS";
            modalText.style.display = 'none';
            configSection.style.display = 'none';
            shopSection.style.display = 'none';
            nameInputSection.style.display = 'none';
            leaderboardSection.style.display = 'block';
            shareScoreBtn.style.display = highScores.length > 0 ? 'block' : 'none';

            scoresList.innerHTML = '';
            if (highScores.length === 0) {
                scoresList.innerHTML = '<li style="justify-content:center; color:#94a3b8;">Aucun record</li>';
            } else {
                highScores.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span>#${index+1} ${item.name}</span> <strong>${item.score} pts</strong>`;
                    scoresList.appendChild(li);
                });
            }

            achievementsBox.innerHTML = `
                <b>Trophées Débloqués :</b><br>
                🔥 Maître du Feu : ${achievements.fireMaster ? '✅' : '❌'}<br>
                ⚡ Sniper Laser : ${achievements.laserSniper ? '✅' : '❌'}<br>
                🛡️ Survivant : ${achievements.survivor ? '✅' : '❌'}
            `;

            modal.style.display = 'flex';
        }

        launchGameBtn.addEventListener('click', () => {
            difficulty = difficultySelect.value;
            score = 0;
            level = 1;
            lives = difficulty === 'easy' ? 5 : (difficulty === 'hardcore' ? 1 : 3);
            paddle.width = 120;
            scoreSpan.textContent = score;
            levelSpan.textContent = level;
            livesSpan.textContent = lives;
            initLevel();
            gameActive = true;
            isPaused = false;
            pauseBtn.textContent = "Pause";
            startBtn.textContent = "Lancer";
            modal.style.display = 'none';
        });

        saveScoreBtn.addEventListener('click', () => {
            const name = playerNameInput.value.trim() || 'Anonyme';
            highScores.push({ name, score });
            highScores.sort((a, b) => b.score - a.score);
            highScores = highScores.slice(0, 5);
            localStorage.setItem('brickGameScores', JSON.stringify(highScores));
            updateHighScoreDisplay();
            showLeaderboardModal();
            startBtn.textContent = "Jouer";
        });

        shareScoreBtn.addEventListener('click', () => {
            const text = `🔥 J'ai atteint le niveau ${level} avec ${score} points sur Casse-Briques Ultime ! Peux-tu me battre ? Joue ici : https://troplife56-source.github.io/cassebrik/`;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => alert("Score et lien copiés !"));
            } else {
                prompt("Copie ton score :", text);
            }
        });

        scoresBtn.addEventListener('click', showLeaderboardModal);
        closeModalBtn.addEventListener('click', () => { modal.style.display = 'none'; });

        function resetGame() {
            modalTitle.textContent = "NOUVELLE PARTIE";
            modalText.style.display = 'block';
            configSection.style.display = 'block';
            shopSection.style.display = 'none';
            nameInputSection.style.display = 'none';
            leaderboardSection.style.display = 'none';
            modal.style.display = 'flex';
            gameActive = false;
        }

        resetBtn.addEventListener('click', () => resetGame());
        startBtn.addEventListener('click', () => {
            if (!gameActive || lives <= 0) {
                resetGame();
            } else {
                balls.forEach(b => {
                    if (!b.launched) {
                        b.launched = true;
                        let speedMultiplier = difficulty === 'hard' ? 1.4 : (difficulty === 'hardcore' ? 1.7 : 1.0);
                        // La vitesse globale de la balle augmente à chaque niveau !
                        let levelSpeedBonus = 1 + ((level - 1) * 0.05);
                        b.dx = (3 + (level * 0.2)) * speedMultiplier * levelSpeedBonus;
                        b.dy = - ((4 + (level * 0.3)) * speedMultiplier * levelSpeedBonus);
                    }
                });
            }
        });

        pauseBtn.addEventListener('click', () => {
            if (!gameActive) return;
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? "Reprendre" : "Pause";
        });

        function draw() {
            ctx.save();
            if (screenShake > 0) {
                ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (flashEffect > 0) {
                ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            if (portalTimer > 0) {
                ctx.fillStyle = '#06b6d4';
                ctx.fillRect(0, canvas.height / 2 - 40, 4, 80);
                ctx.fillRect(canvas.width - 4, canvas.height / 2 - 40, 4, 80);
            }

            // Affichage du Boss Volant (style rétro avec yeux menaçants et jauge de vie)
            if (isBossLevel) {
                // Corps du boss volant
                ctx.fillStyle = '#b91c1c';
                ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
                ctx.strokeStyle = '#fef08a';
                ctx.lineWidth = 2;
                ctx.strokeRect(boss.x, boss.y, boss.width, boss.height);

                // Yeux en colère du boss (style Mario rétro)
                let eyeOffset = Math.sin(boss.animTimer) * 2;
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(boss.x + 35 + eyeOffset, boss.y + 12, 25, 18);
                ctx.fillRect(boss.x + 160 - eyeOffset, boss.y + 12, 25, 18);
                ctx.fillStyle = '#000000';
                ctx.fillRect(boss.x + 45 + eyeOffset, boss.y + 16, 10, 10);
                ctx.fillRect(boss.x + 170 - eyeOffset, boss.y + 16, 10, 10);

                // Texte et PV du boss
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`⚡ BOSS VOLANT (PV: ${boss.health}/${boss.maxHealth}) ⚡`, boss.x + boss.width / 2, boss.y + boss.height + 15);
            } else {
                for (let c = 0; c < brickColumnCount; c++) {
                    for (let r = 0; r < brickRowCount; r++) {
                        let brick = bricks[c][r];
                        if (brick.status === 1) {
                            let bx = brickOffsetLeft + c * (brickWidth + brickPadding);
                            let by = brickOffsetTop + r * (brickHeight + brickPadding);
                            
                            if (brick.tnt) {
                                ctx.fillStyle = '#f97316';
                            } else if (brick.hits >= 50) {
                                ctx.fillStyle = '#7f1d1d';
                            } else if (brick.hits >= 5) {
                                ctx.fillStyle = '#f43f5e';
                            } else {
                                ctx.fillStyle = (r % 2 === 0 ? '#0284c7' : '#4f46e5');
                            }
                            
                            ctx.fillRect(bx, by, brickWidth, brickHeight);

                            if (brick.tnt) {
                                ctx.fillStyle = '#ffffff';
                                ctx.font = 'bold 11px sans-serif';
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillText("TNT 💣", bx + brickWidth / 2, by + brickHeight / 2);
                            } else if (brick.hits > 1) {
                                ctx.fillStyle = '#ffffff';
                                ctx.font = 'bold 11px sans-serif';
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillText(brick.hits, bx + brickWidth / 2, by + brickHeight / 2);
                            }
                        }
                    }
                }
            }

            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });

            powerups.forEach(pu => {
                ctx.fillStyle = pu.trap ? '#111827' : (pu.type === 'multi' ? '#10b981' : (pu.type === 'expand' ? '#f59e0b' : (pu.type === 'fire' ? '#ef4444' : (pu.type === 'laser' ? '#8b5cf6' : (pu.type === 'portal' ? '#06b6d4' : '#ec4899')))));
                ctx.fillRect(pu.x - pu.width/2, pu.y - pu.height/2, pu.width, pu.height);
                ctx.strokeStyle = pu.trap ? '#ef4444' : '#ffffff';
                ctx.strokeRect(pu.x - pu.width/2, pu.y - pu.height/2, pu.width, pu.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                let symbol = pu.type === 'multi' ? 'M' : (pu.type === 'expand' ? 'E' : (pu.type === 'fire' ? '🔥' : (pu.type === 'laser' ? '⚡' : (pu.type === 'life' ? '❤️' : (pu.type === 'portal' ? '🌀' : '💀')))));
                ctx.fillText(symbol, pu.x, pu.y);
            });

            ctx.fillStyle = '#a855f7';
            lasers.forEach(l => {
                ctx.fillRect(l.x - 2, l.y, 4, 12);
            });

            ctx.save();
            ctx.translate(paddle.x + paddle.width / 2, paddle.y + paddle.height / 2);
            ctx.rotate(paddle.angle);
            ctx.fillStyle = paddle.laserTimer > 0 ? '#a855f7' : '#38bdf8';
            ctx.fillRect(-paddle.width / 2, -paddle.height / 2, paddle.width, paddle.height);
            ctx.restore();

            balls.forEach(b => {
                if (b.trail) {
                    b.trail.forEach((t, idx) => {
                        ctx.fillStyle = b.fireball ? `rgba(239, 68, 68, ${idx * 0.1})` : `rgba(255, 255, 255, ${idx * 0.1})`;
                        ctx.beginPath();
                        ctx.arc(t.x, t.y, b.radius * (idx / b.trail.length), 0, Math.PI * 2);
                        ctx.fill();
                    });
                }

                ctx.fillStyle = b.fireball ? '#ef4444' : '#ffffff';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            if (isPaused) {
                ctx.fillStyle = 'rgba(2, 6, 23, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 40px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText("PAUSE", canvas.width / 2, canvas.height / 2);
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
