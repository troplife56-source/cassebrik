<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casse-Briques Pro - Arcade Ultime</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 5px;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }
        #game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 100%;
            max-width: 500px;
        }
        #info {
            display: flex;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            flex-wrap: wrap;
            justify-content: center;
        }
        .badge {
            background: rgba(30, 41, 59, 0.85);
            padding: 4px 10px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .badge-gold {
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.3);
        }
        canvas {
            border: 2px solid #334155;
            background: radial-gradient(circle at center, #090d16 0%, #020617 100%);
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 3;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            cursor: crosshair;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .btn {
            padding: 8px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            background: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(79, 70, 229, 0.4);
            flex: 1;
            min-width: 30%;
        }
        .btn-secondary {
            background: linear-gradient(135deg, #475569 0%, #334155 100%);
        }
        .btn-danger {
            background: linear-gradient(135deg, #e11d48 0%, #9f1239 100%);
        }
        .btn-warning {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
        }
        .btn-success {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
        }

        #modal {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 1rem;
        }
        .modal-content {
            background: #1e293b;
            border: 2px solid #334155;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 20px 25px rgba(0,0,0,0.5);
        }
        .modal-content h2 {
            color: #38bdf8;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }
        .modal-content input {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 6px;
            margin-bottom: 1rem;
            text-align: center;
            box-sizing: border-box;
        }
        .high-scores-list {
            list-style: none;
            padding: 0;
            margin: 1rem 0;
            text-align: left;
        }
        .high-scores-list li {
            display: flex;
            justify-content: space-between;
            padding: 6px 8px;
            border-bottom: 1px solid #334155;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="info">
            <div class="badge">SCORE: <span id="score">0</span></div>
            <div class="badge">NIVEAU: <span id="level">1</span></div>
            <div class="badge">VIES: <span id="lives">3</span></div>
            <div class="badge badge-gold">REC: <span id="highScore">0</span></div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div class="btn-group">
            <button id="startBtn" class="btn">Jouer</button>
            <button id="pauseBtn" class="btn btn-warning">Pause</button>
            <button id="resetBtn" class="btn btn-danger">Reset</button>
            <button id="scoresBtn" class="btn btn-secondary">Scores</button>
            <button id="soundBtn" class="btn btn-secondary">🔊 Son</button>
        </div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">TABLEAU DES SCORES</h2>
            <p id="modalText" style="margin-bottom: 1rem; color: #94a3b8; display:none;"></p>
            
            <div id="nameInputSection" style="display:none;">
                <input type="text" id="playerName" placeholder="Votre pseudo" maxlength="15">
                <button id="saveScoreBtn" class="btn" style="width: 100%;">Enregistrer</button>
            </div>

            <div id="leaderboardSection">
                <ul class="high-scores-list" id="scoresList"></ul>
                <div style="display: flex; gap: 6px; margin-top: 10px;">
                    <button id="shareScoreBtn" class="btn btn-success" style="display:none;">📤 Partager</button>
                    <button id="closeModalBtn" class="btn" style="flex:1;">Fermer</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('score');
        const levelSpan = document.getElementById('level');
        const livesSpan = document.getElementById('lives');
        const highScoreSpan = document.getElementById('highScore');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const scoresBtn = document.getElementById('scoresBtn');
        const soundBtn = document.getElementById('soundBtn');
        
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        const nameInputSection = document.getElementById('nameInputSection');
        const leaderboardSection = document.getElementById('leaderboardSection');
        const playerNameInput = document.getElementById('playerName');
        const saveScoreBtn = document.getElementById('saveScoreBtn');
        const scoresList = document.getElementById('scoresList');
        const shareScoreBtn = document.getElementById('shareScoreBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');

        let score = 0;
        let level = 1;
        let lives = 3;
        let gameActive = false;
        let isPaused = false;
        let soundEnabled = true;
        let screenShake = 0;

        let audioCtx = null;
        function playSound(type) {
            if (!soundEnabled) return;
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'brick') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'powerup') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'laser') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.4);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundBtn.textContent = soundEnabled ? "🔊 Son" : "🔇 Son";
        });

        let highScores = JSON.parse(localStorage.getItem('brickGameScores')) || [];
        updateHighScoreDisplay();

        function updateHighScoreDisplay() {
            highScoreSpan.textContent = highScores.length > 0 ? highScores[0].score : '0';
        }

        const paddle = {
            width: 120,
            height: 16,
            x: 340,
            y: 560,
            angle: 0,
            targetAngle: 0,
            laserTimer: 0
        };

        let balls = [];
        let bricks = [];
        const brickRowCount = 5;
        const brickColumnCount = 8;
        const brickWidth = 75;
        const brickHeight = 22;
        const brickPadding = 12;
        let brickOffsetLeft = 0;
        let brickOffsetTop = 60;

        let particles = [];
        let powerups = [];
        let lasers = [];

        function initLevel() {
            const totalGridWidth = (brickColumnCount * brickWidth) + ((brickColumnCount - 1) * brickPadding);
            brickOffsetLeft = (canvas.width - totalGridWidth) / 2;
            brickOffsetTop = Math.min(60 + (level - 1) * 18, 170);

            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    let hitsNeeded = 1;
                    if (level >= 3 && r === 0 && (c === 3 || c === 4)) {
                        hitsNeeded = 50;
                    } else if (level >= 2 && r === 0) {
                        hitsNeeded = 5;
                    }

                    bricks[c][r] = { x: 0, y: 0, status: 1, hits: hitsNeeded, maxHits: hitsNeeded };
                }
            }
            powerups = [];
            lasers = [];
            resetBalls();
        }

        function resetBalls() {
            balls = [{
                x: paddle.x + paddle.width / 2,
                y: paddle.y - 15,
                radius: 8,
                dx: 0,
                dy: 0,
                launched: false,
                fireball: false
            }];
        }

        initLevel();

        function handleMove(clientX) {
            if (isPaused) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            let touchX = (clientX - rect.left) * scaleX;
            paddle.x = touchX - paddle.width / 2;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;

            balls.forEach(b => {
                if (!b.launched) {
                    b.x = paddle.x + paddle.width / 2;
                }
            });
        }

        canvas.addEventListener('mousemove', (e) => handleMove(e.clientX));
        canvas.addEventListener('touchmove', (e) => { if (e.touches.length > 0) handleMove(e.touches[0].clientX); }, { passive: true });
        canvas.addEventListener('touchstart', (e) => { if (e.touches.length > 0) handleMove(e.touches[0].clientX); }, { passive: true });

        canvas.addEventListener('wheel', (e) => {
            if (isPaused) return;
            e.preventDefault();
            paddle.targetAngle += Math.sign(e.deltaY) * 0.15;
            paddle.targetAngle = Math.max(-0.6, Math.min(0.6, paddle.targetAngle));
        }, { passive: false });

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x, y: y,
                    dx: (Math.random() - 0.5) * 6,
                    dy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1,
                    decay: 0.03
                });
            }
        }

        function spawnPowerup(x, y) {
            const types = ['multi', 'expand', 'fire', 'laser'];
            const type = types[Math.floor(Math.random() * types.length)];
            powerups.push({ x, y, width: 24, height: 24, dy: 2, type });
        }

        function update() {
            if (!gameActive || isPaused) return;

            if (screenShake > 0) screenShake--;

            paddle.angle += (paddle.targetAngle - paddle.angle) * 0.2;
            paddle.targetAngle *= 0.92;

            // Gestion des tirs laser de la raquette
            if (paddle.laserTimer > 0) {
                paddle.laserTimer--;
                if (paddle.laserTimer % 20 === 0) {
                    lasers.push({ x: paddle.x + 15, y: paddle.y, dy: -8 });
                    lasers.push({ x: paddle.x + paddle.width - 15, y: paddle.y, dy: -8 });
                    playSound('laser');
                }
            }

            for (let i = lasers.length - 1; i >= 0; i--) {
                let l = lasers[i];
                l.y += l.dy;
                if (l.y < 0) {
                    lasers.splice(i, 1);
                    continue;
                }
                // Collision laser / briques
                for (let c = 0; c < brickColumnCount; c++) {
                    for (let r = 0; r < brickRowCount; r++) {
                        let brick = bricks[c][r];
                        if (brick.status === 1) {
                            let bx = brickOffsetLeft + c * (brickWidth + brickPadding);
                            let by = brickOffsetTop + r * (brickHeight + brickPadding);
                            if (l.x > bx && l.x < bx + brickWidth && l.y > by && l.y < by + brickHeight) {
                                brick.hits--;
                                lasers.splice(i, 1);
                                if (brick.hits <= 0) {
                                    brick.status = 0;
                                    score += 100 * level;
                                    scoreSpan.textContent = score;
                                    createParticles(bx + brickWidth/2, by + brickHeight/2, '#38bdf8');
                                    playSound('brick');
                                } else {
                                    playSound('hit');
                                }
                                break;
                            }
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                let pu = powerups[i];
                pu.y += pu.dy;
                if (pu.x > paddle.x && pu.x < paddle.x + paddle.width &&
                    pu.y > paddle.y && pu.y < paddle.y + paddle.height) {
                    
                    playSound('powerup');
                    if (pu.type === 'multi') {
                        let extraBalls = [];
                        balls.forEach(b => {
                            extraBalls.push({ ...b, dx: b.dx + 2, dy: b.dy, launched: true });
                            extraBalls.push({ ...b, dx: b.dx - 2, dy: b.dy, launched: true });
                        });
                        balls.push(...extraBalls);
                    } else if (pu.type === 'expand') {
                        paddle.width = Math.min(paddle.width + 30, 180);
                    } else if (pu.type === 'fire') {
                        balls.forEach(b => b.fireball = true);
                    } else if (pu.type === 'laser') {
                        paddle.laserTimer = 300; // 5 secondes de tirs
                    }
                    powerups.splice(i, 1);
                } else if (pu.y > canvas.height) {
                    powerups.splice(i, 1);
                }
            }

            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];
                if (!b.launched) continue;

                b.x += b.dx;
                b.y += b.dy;

                if (b.x - b.radius < 0) { b.x = b.radius; b.dx *= -1; }
                if (b.x + b.radius > canvas.width) { b.x = canvas.width - b.radius; b.dx *= -1; }
                if (b.y - b.radius < 0) { b.y = b.radius; b.dy *= -1; }

                if (b.y + b.radius >= paddle.y && b.y - b.radius <= paddle.y + paddle.height &&
                    b.x >= paddle.x && b.x <= paddle.x + paddle.width) {
                    
                    playSound('hit');
                    b.y = paddle.y - b.radius;
                    let hitPoint = (b.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                    let bounceAngle = hitPoint * (Math.PI / 3) + paddle.angle;
                    let currentSpeed = Math.hypot(b.dx, b.dy);

                    b.dx = currentSpeed * Math.sin(bounceAngle);
                    b.dy = -Math.abs(currentSpeed * Math.cos(bounceAngle));
                }

                let levelComplete = true;
                for (let c = 0; c < brickColumnCount; c++) {
                    for (let r = 0; r < brickRowCount; r++) {
                        let brick = bricks[c][r];
                        if (brick.status === 1) {
                            levelComplete = false;
                            let bx = brickOffsetLeft + c * (brickWidth + brickPadding);
                            let by = brickOffsetTop + r * (brickHeight + brickPadding);

                            if (b.x > bx && b.x < bx + brickWidth && b.y > by && b.y < by + brickHeight) {
                                if (!b.fireball) b.dy *= -1; // La fireball traverse sans rebondir !
                                brick.hits--;

                                if (brick.hits >= 50) {
                                    screenShake = 10; // Secousse d'écran sur les forteresses
                                }

                                if (brick.hits <= 0) {
                                    brick.status = 0;
                                    score += 100 * level * (brick.maxHits > 1 ? brick.maxHits : 1);
                                    scoreSpan.textContent = score;
                                    createParticles(bx + brickWidth/2, by + brickHeight/2, b.fireball ? '#ef4444' : '#38bdf8');
                                    playSound('brick');
                                    if (Math.random() < 0.25) spawnPowerup(bx + brickWidth/2, by + brickHeight/2);
                                } else {
                                    playSound('hit');
                                    createParticles(bx + brickWidth/2, by + brickHeight/2, '#f43f5e');
                                }
                            }
                        }
                    }
                }

                if (levelComplete) {
                    level++;
                    levelSpan.textContent = level;
                    initLevel();
                    break;
                }

                if (b.y - b.radius > canvas.height) {
                    balls.splice(i, 1);
                }
            }

            if (balls.length === 0) {
                lives--;
                livesSpan.textContent = lives;
                playSound('lose');
                if (lives <= 0) {
                    triggerGameOverModal();
                } else {
                    resetBalls();
                }
            }
        }

        function triggerGameOverModal() {
            gameActive = false;
            modalTitle.textContent = "PARTIE TERMINÉE";
            modalText.style.display = 'block';
            modalText.textContent = `Score final : ${score} (Niveau ${level})`;
            nameInputSection.style.display = 'block';
            leaderboardSection.style.display = 'none';
            shareScoreBtn.style.display = 'none';
            playerNameInput.value = '';
            modal.style.display = 'flex';
        }

        function showLeaderboardModal() {
            modalTitle.textContent = "🏆 SCORES";
            modalText.style.display = 'none';
            nameInputSection.style.display = 'none';
            leaderboardSection.style.display = 'block';
            shareScoreBtn.style.display = highScores.length > 0 ? 'block' : 'none';

            scoresList.innerHTML = '';
            if (highScores.length === 0) {
                scoresList.innerHTML = '<li style="justify-content:center; color:#94a3b8;">Aucun record</li>';
            } else {
                highScores.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span>#${index+1} ${item.name}</span> <strong>${item.score} pts</strong>`;
                    scoresList.appendChild(li);
                });
            }
            modal.style.display = 'flex';
        }

        saveScoreBtn.addEventListener('click', () => {
            const name = playerNameInput.value.trim() || 'Anonyme';
            highScores.push({ name, score });
            highScores.sort((a, b) => b.score - a.score);
            highScores = highScores.slice(0, 5);
            localStorage.setItem('brickGameScores', JSON.stringify(highScores));
            updateHighScoreDisplay();

            showLeaderboardModal();
            startBtn.textContent = "Jouer";
        });

        shareScoreBtn.addEventListener('click', () => {
            const text = `🔥 J'ai atteint le niveau ${level} avec ${score} points sur Casse-Briques Pro ! Peux-tu me battre ? Joue ici : https://troplife56-source.github.io/cassebrik/`;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    alert("Lien et score copiés dans le presse-papier ! Tu peux les coller partout.");
                });
            } else {
                prompt("Copie ton score :", text);
            }
        });

        scoresBtn.addEventListener('click', showLeaderboardModal);
        closeModalBtn.addEventListener('click', () => { modal.style.display = 'none'; });

        function resetGame() {
            gameActive = false;
            isPaused = false;
            score = 0;
            level = 1;
            lives = 3;
            paddle.width = 120;
            scoreSpan.textContent = score;
            levelSpan.textContent = level;
            livesSpan.textContent = lives;
            startBtn.textContent = "Jouer";
            pauseBtn.textContent = "Pause";
            initLevel();
        }

        resetBtn.addEventListener('click', () => resetGame());
        pauseBtn.addEventListener('click', () => {
            if (!gameActive) return;
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? "Reprendre" : "Pause";
        });

        function draw() {
            ctx.save();
            // Effet de secousse d'écran (Screen Shake)
            if (screenShake > 0) {
                let offsetX = (Math.random() - 0.5) * 8;
                let offsetY = (Math.random() - 0.5) * 8;
                ctx.translate(offsetX, offsetY);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    let brick = bricks[c][r];
                    if (brick.status === 1) {
                        let bx = brickOffsetLeft + c * (brickWidth + brickPadding);
                        let by = brickOffsetTop + r * (brickHeight + brickPadding);
                        
                        if (brick.hits >= 50) {
                            ctx.fillStyle = '#7f1d1d';
                        } else if (brick.hits >= 5) {
                            ctx.fillStyle = '#f43f5e';
                        } else {
                            ctx.fillStyle = (r % 2 === 0 ? '#0284c7' : '#4f46e5');
                        }
                        
                        ctx.fillRect(bx, by, brickWidth, brickHeight);

                        if (brick.hits > 1) {
                            ctx.fillStyle = '#ffffff';
                            ctx.font = 'bold 11px sans-serif';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(brick.hits, bx + brickWidth / 2, by + brickHeight / 2);
                        }
                    }
                }
            }

            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            powerups.forEach(pu => {
                ctx.fillStyle = pu.type === 'multi' ? '#10b981' : (pu.type === 'expand' ? '#f59e0b' : (pu.type === 'fire' ? '#ef4444' : '#8b5cf6'));
                ctx.fillRect(pu.x - pu.width/2, pu.y - pu.height/2, pu.width, pu.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(pu.type === 'multi' ? 'M' : (pu.type === 'expand' ? 'E' : (pu.type === 'fire' ? '🔥' : '⚡')), pu.x, pu.y);
            });

            // Dessin des tirs laser
            ctx.fillStyle = '#a855f7';
            lasers.forEach(l => {
                ctx.fillRect(l.x - 2, l.y, 4, 12);
            });

            // Raquette (avec effet laser si actif)
            ctx.save();
            ctx.translate(paddle.x + paddle.width / 2, paddle.y + paddle.height / 2);
            ctx.rotate(paddle.angle);
            ctx.fillStyle = paddle.laserTimer > 0 ? '#a855f7' : '#38bdf8';
            ctx.fillRect(-paddle.width / 2, -paddle.height / 2, paddle.width, paddle.height);
            ctx.restore();

            balls.forEach(b => {
                ctx.fillStyle = b.fireball ? '#ef4444' : '#ffffff';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            if (isPaused) {
                ctx.fillStyle = 'rgba(2, 6, 23, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 40px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText("PAUSE", canvas.width / 2, canvas.height / 2);
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        startBtn.addEventListener('click', () => {
            if (!gameActive || lives <= 0) {
                score = 0;
                level = 1;
                lives = 3;
                paddle.width = 120;
                scoreSpan.textContent = score;
                levelSpan.textContent = level;
                livesSpan.textContent = lives;
                initLevel();
                gameActive = true;
                isPaused = false;
                pauseBtn.textContent = "Pause";
                startBtn.textContent = "Lancer";
            }

            balls.forEach(b => {
                if (!b.launched) {
                    b.launched = true;
                    b.dx = 3 + (level * 0.2);
                    b.dy = - (4 + (level * 0.3));
                }
            });
        });

        loop();
    </script>
</body>
</html>
